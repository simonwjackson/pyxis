<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pyxis</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches --px-ground so a standalone launch and the first paint are the same colour
         as the app, instead of flashing white before the stylesheet arrives. -->
    <meta name="theme-color" content="#131210" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/pyxis.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* The shell is exactly the viewport, so the surface scrolls inside the frame instead of
         the document scrolling and taking the player bar with it. A percentage height resolves
         only against a parent that has a definite one, so the chain has to start at the
         document -- without these three the frame silently falls back to content height. */
      html,
      body,
      #root {
        block-size: 100%;
      }
      body {
        margin: 0;
        background: #131210;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
