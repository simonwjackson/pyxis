<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pyxis — Stacks</title>
    <script>
      const requested = new URLSearchParams(location.search).get("theme")
      const stored = requested || localStorage.getItem("pyxis-theme")
      if (stored === "dark" || stored === "light") document.documentElement.dataset.theme = stored
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./system.css" />
    <style>
      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 var(--s5) var(--s9);
      }
      /* A bar, not a masthead. Counts are state, not a headline. */
      .tally a {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: color-mix(in oklab, var(--ink) 35%, transparent);
        text-underline-offset: 3px;
      }
      .item {
        display: block;
        padding: 0;
        text-align: left;
        background: none;
        border: none;
        cursor: pointer;
        scroll-snap-align: start;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.5s ease,
          transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .item.in {
        opacity: 1;
        transform: none;
      }
      .item .sleeve {
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .item:hover .sleeve,
      .item:focus-visible .sleeve {
        transform: scale(1.045);
      }
      .item:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }
      /* Everything you always need is on the surface. Everything else is one tap away. */
      .tools {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: var(--s2);
        padding: var(--s3) 0;
        margin-top: var(--s6);
        background: var(--ground);
        border-top: 1px solid var(--ink);
      }
      .tools .find {
        min-width: 0;
        flex: 1;
        padding: var(--s3) var(--s3);
        font: inherit;
        font-size: var(--t-small);
        color: var(--ink);
        background: var(--raised);
        border: 1px solid var(--rule);
        border-radius: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .tools .find::placeholder {
        color: var(--soft);
      }
      .tools select {
        padding: var(--s3) var(--s2);
        font: inherit;
        font-size: var(--t-small);
        font-weight: 600;
        color: var(--ink);
        background: var(--raised);
        border: 1px solid var(--rule);
        border-radius: 0;
      }
      .tools .more {
        display: flex;
        gap: var(--s2);
        align-items: center;
        padding: var(--s3) var(--s3);
        font-size: var(--t-small);
        font-weight: 600;
        border: 1px solid var(--rule);
        white-space: nowrap;
      }
      .tools .more[data-active="true"] {
        color: var(--ground);
        background: var(--ink);
        border-color: var(--ink);
      }
      .tools .more b {
        font-weight: 700;
      }
      .chips button:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      .chips button i {
        font-style: normal;
        opacity: 0.7;
      }
      .count {
        padding: var(--s3) 0 0;
        font-size: var(--t-small);
        font-weight: 600;
        color: var(--soft);
      }
      .none {
        padding: var(--s6) 0;
        font-size: var(--t-small);
        color: var(--soft);
      }

      /* dialog.sheet and .sheet-head are system components; see system.css. */
      .group {
        padding: var(--s4) 0 var(--s1);
        border-top: 1px solid var(--rule);
      }
      .group .label {
        display: block;
        padding-bottom: var(--s2);
      }
      /* No captions: the wall is covers only, so it can sit tight. */
      .detail {
        padding: var(--s5);
      }
      .detail .top {
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: var(--s5);
      }
      .detail .who {
        margin-top: var(--s2);
        font-size: var(--t-small);
        font-weight: 600;
        color: var(--soft);
      }
      dl.signals {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--s3) var(--s4);
        margin: var(--s5) 0 0;
        padding-top: var(--s4);
        border-top: 1px solid var(--rule);
      }
      dl.signals dt {
        font-size: var(--t-small);
        font-weight: 500;
        color: var(--soft);
      }
      dl.signals dd {
        margin: var(--s1) 0 0;
        font-size: var(--t-body);
        font-weight: 600;
      }
      .move button {
        padding: var(--s2) var(--s4);
        font: inherit;
        font-size: var(--t-small);
        font-weight: 600;
        background: none;
        border: 1px solid var(--rule);
        cursor: pointer;
      }
      .move button[aria-pressed="true"] {
        color: var(--ground);
        background: var(--ink);
        border-color: var(--ink);
      }
      .device-state {
        min-width: 0;
        flex: 1;
        margin: 0;
        font-size: var(--t-small);
      }
      .device-state b {
        display: block;
        font-weight: 700;
      }
      .device-state span {
        color: var(--soft);
      }
      .device .act {
        flex: none;
        padding: var(--s3) var(--s3);
        font-size: var(--t-small);
        letter-spacing: 0;
        text-transform: none;
      }
      .play {
        display: flex;
        gap: var(--s2);
        margin-top: var(--s5);
      }
      .play button {
        padding: var(--s3) var(--s5);
        font: inherit;
        font-size: var(--t-small);
        font-weight: 700;
        color: var(--ground);
        background: var(--tint, var(--ink));
        border: 1px solid var(--ink);
        cursor: pointer;
      }
      .play button:hover,
      .play button:focus-visible {
        background: color-mix(in oklab, var(--tint, var(--ink)) 85%, var(--ink));
        border-color: transparent;
      }
      .play .quiet {
        color: var(--ink);
        background: none;
        border-color: var(--rule);
      }
      .play .quiet:hover,
      .play .quiet:focus-visible {
        background: none;
        border-color: var(--ink);
      }
      .close {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        padding: var(--s3) var(--s3) 0;
        background: var(--pool, var(--ground));
      }
      @media (max-width: 620px) {
        .detail .top {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="strip"></div>
    <main id="root"></main>
    <dialog id="detail" class="sheet wide"></dialog>

    <script type="module">
      import { ago, availability, element, escape, loadLibrary, policyLabel, reveal, runtime, sleeve, tintFrom, wantedOffline } from "./common.js"
      import { albumLead, albumShelf, albumTile } from "./albums.js"
      import { icon } from "./icons.js"
      import { productNav } from "./nav.js"
      import { mountWindow } from "./parts.js"
      import { currentSession, mountNowPlaying } from "./nowplaying.js"
      import { expiredSource } from "./sources.js"
      import { currentState } from "./states.js"


      const root = document.getElementById("root")
      const dialog = document.getElementById("detail")
      const mode = currentState()
      const offline = mode === "offline"
      if (offline) document.body.classList.add("offline")

      // Skeleton first, in the real geometry, so nothing jumps when the data lands.
      const tile = () => `<span class="frame skeleton" style="aspect-ratio:1"></span>`
      root.innerHTML = `
        <header ><span class="skeleton" style="width:150px;height:14px"></span></header>
        ${[0, 1]
          .map(
            () => `
          <section class="shelf">
            <h2><span class="skeleton" style="display:inline-block;width:118px;height:11px"></span></h2>
            <div class="rail">${Array.from({ length: 6 }, tile).join("")}</div>
          </section>`,
          )
          .join("")}
        <div class="grid">${Array.from({ length: 18 }, tile).join("")}</div>
      `

      if (offline) {
        document.getElementById("strip").append(
          element(
            `<p class="strip"><b>Offline</b> <span class="right">changes are queued</span></p>`,
          ),
        )
      }

      // A queued change that came back rejected. Offline is a condition and says so quietly;
      // this is a thing that did not happen, so it is coloured and carries the retry. It
      // names the album, because "a change" is not something anyone can act on.
      if (mode === "writefailed") {
        const failed = element(`
          <p class="strip failed">
            <b>Not saved</b>
            <span class="right">Moving Bloom to collection failed <button>Retry</button></span>
          </p>
        `)
        failed.querySelector("button").onclick = () => failed.remove()
        document.getElementById("strip").append(failed)
      }

      const library = await loadLibrary(mode)

      // A source that has signed itself out is not a fact about a settings screen. It is a
      // fact about the album someone is about to tap, so it is said on the wall and counted:
      // "some albums" is not something anyone can act on, and the number decides whether this
      // is a shrug or an emergency.
      const out = expiredSource(mode)
      const stranded = out ? library.filter((album) => album.source === out.id) : []
      if (out && stranded.length > 0) {
        document.getElementById("strip").append(
          element(`
            <p class="strip failed">
              <b>${escape(out.name)} signed out</b>
              <span class="right">${stranded.length} albums cannot play
                <a class="act inline" href="./f-sources.html${location.search}">Sign in</a></span>
            </p>
          `),
        )
      }
      const strandedIds = new Set(stranded.map((album) => album.id))
      const sounds = currentSession(library, mode)

      // The page's context, bound to the shared tile once rather than passed at every site.
      const item = (album) =>
        albumTile(album, {
          sounding: album.id === sounds?.album?.id,
          offline,
          onOpen: open,
        })
      const shelf = (title, albums) => albumShelf(title, albums, { tile: item })

      // Placement and sort are always on screen. Signals and decades sit behind one tap,
      // so the browser stays legible until you actually ask for more control.
      const state = {
        query: "",
        placement: "collection",
        signals: new Set(),
        decades: new Set(),
        sort: "artist",
      }

      const SIGNALS = {
        pinned: { label: "On this device", test: (album) => availability(album) === "available" },
        hot: { label: "In rotation", test: (album) => album.hot },
        untouched: { label: "Untouched", test: (album) => album.daysSincePlay > 365 },
        never: { label: "Never played", test: (album) => album.playCount === 0 },
        full: { label: "Heard in full", test: (album) => album.completeness >= 0.5 },
      }

      const SORTS = {
        artist: ["Artist", (a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title)],
        added: ["Recently added", (a, b) => new Date(b.addedAt) - new Date(a.addedAt)],
        played: ["Recently played", (a, b) => (b.lastPlayedAt ?? 0) - (a.lastPlayedAt ?? 0)],
        neglected: ["Longest unplayed", (a, b) => (b.daysSincePlay ?? 1e6) - (a.daysSincePlay ?? 1e6)],
        year: ["Year", (a, b) => (b.year ?? 0) - (a.year ?? 0)],
      }

      const decadeOf = (album) => (album.year ? `${Math.floor(album.year / 10) * 10}s` : null)
      const decades = [...new Set(library.map(decadeOf).filter(Boolean))].sort().reverse()

      function results() {
        const query = state.query.trim().toLowerCase()
        return library
          .filter((album) => {
            if (state.placement !== "any" && album.placement !== state.placement) return false
            if (query && !`${album.title} ${album.artist}`.toLowerCase().includes(query)) return false
            for (const key of state.signals) if (!SIGNALS[key].test(album)) return false
            if (state.decades.size && !state.decades.has(decadeOf(album))) return false
            return true
          })
          .sort(SORTS[state.sort][1])
      }

      const activeCount = () =>
        state.signals.size + state.decades.size + (state.placement === "collection" ? 0 : 1)

      const where = (placement) => library.filter((album) => album.placement === placement)

      // Covers only. The album still needs a name for assistive tech and for the desktop
      // tooltip, it just never occupies the wall.


      function open(album) {
        dialog.innerHTML = ""
        const close = element(
          `<div class="close"><button class="transport" aria-label="Close">${icon.down}</button></div>`,
        )
        close.querySelector("button").onclick = () => dialog.close()

        const body = element(`
          <div class="detail">
            <div class="top">
              <span class="frame object">${sleeve(album)}</span>
              <div>
                <h3 class="album-title big">${escape(album.title)}</h3>
                <div class="credit">${escape(album.artist)} · ${album.year ?? "—"}</div>
                <dl class="signals">
                  <div><dt>Plays</dt><dd>${album.playCount}</dd></div>
                  <div><dt>Last heard</dt><dd>${ago(album.lastPlayedAt)}</dd></div>
                  <div><dt>Runtime</dt><dd>${runtime(album)}</dd></div>
                  <div><dt>Depth</dt><dd>${album.completeness < 0.5 ? "singles only" : "heard in full"}</dd></div>
                </dl>
                <div class="play"></div>
                <div class="acts move"></div>
                <div class="aside device"></div>
              </div>
            </div>
          </div>
        `)

        // The sheet wears the album's colour, the same as the player and the lead.
        const art = body.querySelector("img.sleeve")
        if (art) {
          const paint = () => tintFrom(dialog, art)
          if (art.complete && art.naturalWidth > 0) art.decode().then(paint, paint)
          else art.addEventListener("load", paint, { once: true })
        }

        // An album from a signed-out source can still be played if it is already on the
        // device, so the offer depends on where the bytes are, not only on the source. When it
        // cannot play, the button says the thing that would fix it instead of failing on tap.
        const kept = availability(album) === "available"
        const playable = !strandedIds.has(album.id) || kept
        const play = body.querySelector(".play")
        play.append(
          element(
            playable
              ? `<button>Play album</button><button class="quiet">Shuffle</button>`
              : `<a class="act primary" href="./f-sources.html${location.search}">Sign in to play</a>
                 <span class="meta trouble">${escape(out?.name ?? "Source")} signed out</span>`,
          ),
        )
        // Playing closes the sheet: the album is now in the bar, which is where it lives.
        for (const button of play.querySelectorAll("button")) {
          button.onclick = () => {
            document.dispatchEvent(new CustomEvent("pyxis:play", { detail: { album } }))
            dialog.close()
          }
        }

        // Hybrid offline policy: placement decides by default, this overrides it.
        const device = body.querySelector(".device")
        const paintDevice = () => {
          const state = availability(album)
          const heading =
            state === "available"
              ? "On this device"
              : state === "downloading"
                ? "Downloading…"
                : "Not on this device"
          device.innerHTML = ""
          device.append(
            element(`<p class="device-state"><b>${heading}</b><span>${policyLabel(album)}</span></p>`),
          )
          const wanted = wantedOffline(album)
          const button = element(
            `<button class="act">${wanted ? "Remove from device" : "Keep on device"}</button>`,
          )
          button.onclick = () => {
            album.override = album.override === null ? (wanted ? "exclude" : "pin") : null
            paintDevice()
            renderResults()
          }
          device.append(button)
        }
        paintDevice()

        const move = body.querySelector(".move")
        for (const placement of ["discovery", "collection", "archive", "dismissed"]) {
          const button = element(
            `<button aria-pressed="${album.placement === placement}">${
              placement.slice(0, 1).toUpperCase() + placement.slice(1)
            }</button>`,
          )
          button.onclick = () => {
            album.placement = placement
            dialog.close()
            render()
          }
          move.append(button)
        }

        dialog.append(close, body)
        dialog.showModal()
      }

      function browse() {
        const section = element(`
          <section class="js-browse">
            <div class="tools">
              <input class="find" type="search" placeholder="Search ${library.length} albums" />
              <select class="js-sort" aria-label="Sort"></select>
              <button class="more">Filters</button>
            </div>
            <div class="chip-set chips"></div>
            <p class="count"></p>
            <div class="grid"></div>
          </section>
        `)

        const find = section.querySelector(".find")
        find.value = state.query
        find.oninput = () => {
          state.query = find.value
          renderResults()
        }

        const sort = section.querySelector(".js-sort")
        for (const [key, [label]] of Object.entries(SORTS)) {
          const option = element(`<option value="${key}">${label}</option>`)
          sort.append(option)
        }
        sort.value = state.sort
        sort.onchange = () => {
          state.sort = sort.value
          renderResults()
        }

        section.querySelector(".more").onclick = openFilters
        return section
      }

      function openFilters() {
        const sheet = element(`
          <dialog class="sheet">
            <div class="sheet-head"><span class="label">Filters</span><button>Done</button></div>
          </dialog>
        `)
        sheet.querySelector("button").onclick = () => sheet.close()

        const group = (title, options, isOn, toggle) => {
          const node = element(`<div class="group"><span class="label">${title}</span><div class="chip-set js-opts"></div></div>`)
          const holder = node.querySelector(".js-opts")
          for (const option of options) {
            const button = element(`
              <button class="chip" aria-pressed="${isOn(option.value)}">${option.label}${
                option.count === undefined ? "" : ` <i>${option.count}</i>`
              }</button>
            `)
            button.onclick = () => {
              toggle(option.value)
              button.setAttribute("aria-pressed", String(isOn(option.value)))
              if (option.exclusive) {
                for (const sibling of holder.querySelectorAll("button")) {
                  if (sibling !== button) sibling.setAttribute("aria-pressed", "false")
                }
              }
              renderResults()
            }
            holder.append(button)
          }
          return node
        }

        sheet.append(
          group(
            "Placement",
            ["collection", "discovery", "archive", "dismissed", "any"].map((value) => ({
              value,
              label: value,
              exclusive: true,
              count: value === "any" ? library.length : where(value).length,
            })),
            (value) => state.placement === value,
            (value) => {
              state.placement = value
            },
          ),
        )

        sheet.append(
          group(
            "Listening",
            Object.entries(SIGNALS).map(([value, signal]) => ({ value, label: signal.label })),
            (value) => state.signals.has(value),
            (value) => {
              state.signals.has(value) ? state.signals.delete(value) : state.signals.add(value)
            },
          ),
        )

        sheet.append(
          group(
            "Decade",
            decades.map((value) => ({ value, label: value })),
            (value) => state.decades.has(value),
            (value) => {
              state.decades.has(value) ? state.decades.delete(value) : state.decades.add(value)
            },
          ),
        )

        sheet.addEventListener("close", () => sheet.remove())
        document.body.append(sheet)
        sheet.showModal()
      }

      function renderResults() {
        const section = root.querySelector(".js-browse")
        if (!section) return
        const rows = results()

        const chips = section.querySelector(".chips")
        chips.innerHTML = ""
        const chip = (label, clear) => {
          const button = element(`<button class="chip removable">${label} <i>\u00d7</i></button>`)
          button.onclick = () => {
            clear()
            renderResults()
          }
          chips.append(button)
        }
        if (state.placement !== "collection") {
          chip(state.placement, () => {
            state.placement = "collection"
          })
        }
        for (const key of state.signals) {
          chip(SIGNALS[key].label, () => state.signals.delete(key))
        }
        for (const decade of state.decades) {
          chip(decade, () => state.decades.delete(decade))
        }
        if (activeCount() > 1) {
          chip("Clear all", () => {
            state.placement = "collection"
            state.signals.clear()
            state.decades.clear()
          })
        }

        const more = section.querySelector(".more")
        const count = activeCount()
        more.innerHTML = count ? `Filters <b>${count}</b>` : "Filters"
        more.dataset.active = String(count > 0)

        const available = rows.filter((album) => availability(album) === "available").length
        section.querySelector(".count").textContent = offline
          ? `${available} of ${rows.length} on this device`
          : `${rows.length} album${rows.length === 1 ? "" : "s"}`

        const grid = section.querySelector(".grid")
        grid.innerHTML = ""
        if (rows.length > 0) return mountWindow(grid, rows, item)
        if (rows.length === 0) {
          grid.append(
            element(
              activeCount() || state.query
                ? `<p class="none">Nothing matches those filters.</p>`
                : `<p class="none">Nothing in ${escape(state.placement)}.</p>`,
            ),
          )
          return
        }
      }

      function blankState() {
        const panel =
          mode === "nosources"
            ? element(`
                <section class="blank-state">
                  <span class="label">Sources</span>
                  <h2>No sources installed</h2>
                  <p>
                    Pyxis runs without them. Your library, listening history and placements are
                    all still here — but nothing can be searched, added or played until a source
                    is installed.
                  </p>
                  <div class="acts">
                    <button class="act primary">Install a source</button>
                    <button class="act">What is a source?</button>
                  </div>
                </section>
              `)
            : element(`
                <section class="blank-state">
                  <span class="label">Collection</span>
                  <h2>Nothing kept yet</h2>
                  <p>
                    Albums arrive through Discovery. Capture one from a station or a search, then
                    decide whether it belongs here.
                  </p>
                  <div class="acts">
                    <a class="act primary" href="./a-inbox.html">Open Discovery</a>
                    <button class="act">Search for an album</button>
                  </div>
                </section>
              `)
        root.innerHTML = ""
        root.append(panel)
      }

      function render() {
        if (library.length === 0) return blankState()
        root.innerHTML = ""
        root.append(productNav("stacks", { waiting: where("discovery").length }))
        const collection = where("collection")
        const waiting = where("discovery").length

        // The lead: what you are most likely to want, at the size that says so. What is
        // playing, or the last thing that did, or — in a library nobody has played yet — the
        // most recently added. The nav already carries the Discovery count, so it is not
        // repeated here.
        const fallback =
          [...library].filter((a) => a.lastPlayedAt).sort((a, b) => b.lastPlayedAt - a.lastPlayedAt)[0] ??
          [...collection].sort((a, b) => (b.addedAt ?? 0) - (a.addedAt ?? 0))[0] ??
          library[0]

        const leadSlot = element(`<div></div>`)
        root.append(leadSlot)

        // Redrawn whenever the bar says playback changed, so the largest thing on the page
        // cannot end up naming a different album than the bar at the bottom of it.
        const paintLead = ({ album, room } = {}) => {
          const shown = album ?? fallback
          if (!shown) return
          leadSlot.innerHTML = ""
          leadSlot.append(
            albumLead(shown, {
              context: album
                ? `Playing in ${room}`
                : shown.lastPlayedAt
                  ? `Last played ${ago(shown.lastPlayedAt)}`
                  : "Never played",
              onOpen: open,
              onPlay: album
                ? null
                : (chosen) =>
                    document.dispatchEvent(new CustomEvent("pyxis:play", { detail: { album: chosen } })),
            }),
          )
        }
        document.addEventListener("pyxis:playing", (event) => paintLead(event.detail))
        paintLead(sounds ? { album: sounds.album, room: sounds.room } : {})

        root.append(
          element(
            `<p class="tally">${collection.length} albums${
              waiting ? ` \u00b7 <a href="./a-inbox.html">${waiting} waiting in Discovery</a>` : ""
            }</p>`,
          ),
        )

        const shelves = [
          shelf(
            "In rotation",
            library.filter((album) => album.hot).sort((a, b) => b.recentPlays - a.recentPlays),
          ),
          shelf(
            "Untouched",
            collection
              .filter((album) => album.daysSincePlay > 365)
              .sort((a, b) => b.daysSincePlay - a.daysSincePlay),
          ),
          shelf("Never played", collection.filter((album) => album.playCount === 0)),
          shelf(
            "Recently added",
            [...collection].sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt)).slice(0, 20),
          ),
        ]
        for (const node of shelves) if (node) root.append(node)
        // Shelf covers reveal on scroll too. Missing this leaves every rail at opacity 0.
        reveal(root.querySelectorAll(".shelf .item"))

        root.append(browse())
        renderResults()
      }

      render()
      mountNowPlaying(library, { state: mode })
    </script>
    <footer class="ref"><a href="./index.html">Pyxis reference</a></footer>
  </body>
</html>
