<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pyxis — Rooms</title>
    <script>
      const requested = new URLSearchParams(location.search).get("theme")
      const stored = requested || localStorage.getItem("pyxis-theme")
      if (stored === "dark" || stored === "light") document.documentElement.dataset.theme = stored
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./system.css" />
    <style>
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 20px 32px;
      }
      .why {
        padding: 18px 0 4px;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--soft);
      }
      .why b {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main id="root"></main>

    <script type="module">
      import { element, loadLibrary } from "./common.js"
      import { mountNowPlaying } from "./nowplaying.js"
      import { makeRooms, roomsPanel } from "./rooms.js"
      import { currentState } from "./states.js"

      const mode = currentState()

      const root = document.getElementById("root")
      const library = await loadLibrary(mode)
      const rooms = makeRooms(library, mode)

      // Rooms is a sheet in the product, reached from the player's room control. This page
      // exists only so the same panel can be reviewed on its own.
      root.append(
        element(`
          <p class="why">
            <b>Rooms is a sheet, not a destination.</b> In the product this opens from the room
            control in the now-playing bar. Shown here on its own for review.
          </p>
        `),
      )

      const draw = (moving = null) => {
        for (const old of root.querySelectorAll(".rooms-panel")) old.remove()
        root.append(
          roomsPanel(rooms, {
            moving,
            onChange: (event) => {
              if (event.type === "retry") {
                event.room.reachable = true
                draw()
                return
              }
              draw(event.room.id)
              setTimeout(() => {
                const from = rooms.find((room) => room.album)
                const album = from?.album ?? null
                for (const room of rooms) {
                  if (room.id === event.room.id) {
                    Object.assign(room, { album, playing: true, touchedAt: Date.now() })
                  } else {
                    Object.assign(room, { album: null, playing: false })
                  }
                }
                draw()
              }, 900)
            },
          }),
        )
      }

      draw()
      mountNowPlaying(library, { state: mode })
    </script>
    <footer class="ref"><a href="./index.html">Pyxis reference</a></footer>
  </body>
</html>
