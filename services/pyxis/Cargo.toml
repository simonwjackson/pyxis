[package]
name = "pyxis"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pyxis"
path = "src/main.rs"

# Real configurable protocol implementation used by the subprocess acceptance suite.
# Packaging selects only the `pyxis` binary, so this laboratory never ships to users.
[[bin]]
name = "pyxis-plugin-laboratory"
path = "tests/support/plugin_laboratory.rs"

[lib]
name = "pyxis"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
constant_time_eq = "0.4"
fs2 = "0.4"
futures-util = "0.3"
proseql-engine = { path = "../../.cache/proseql/crates/proseql-engine" }
proseql-native = { path = "../../.cache/proseql/crates/proseql-native" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typeshare = "1"
ulid = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
