<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The product has two grounds; the browser chrome should match whichever is showing. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131210" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/pyxis.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- iOS ignores manifest icons and applies its own squircle, so this one is full bleed. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Pyxis reference client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
